plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
android { namespace 'com.nexora.ev'; compileSdk 35
 defaultConfig { applicationId 'com.nexora.ev'; minSdk 23; targetSdk 35; versionCode 5; versionName '1.4-version-handshake' }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 kotlinOptions { jvmTarget = '17' }
 packaging { resources { excludes += ['META-INF/INDEX.LIST', 'META-INF/DEPENDENCIES']; merges += ['META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/NOTICE', 'META-INF/NOTICE.txt'] } }
 buildTypes { release { minifyEnabled true; shrinkResources true; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt') } }
}

dependencies {
 implementation 'io.grpc:grpc-okhttp:1.69.0'
 implementation 'io.grpc:grpc-stub:1.69.0'
}
